name: PR Documentation Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'en/docs/**'
      - 'en/mkdocs.yml'
      - 'en/requirements.txt'

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('en/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd en
          pip install -r requirements.txt

      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed markdown files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'en/docs/**/*.md' | head -5)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Convert first changed file to URL path for screenshot
          if [ ! -z "$CHANGED_FILES" ]; then
            FIRST_FILE=$(echo "$CHANGED_FILES" | head -1)
            # Convert path like 'en/docs/get-started/introduction.md' to 'get-started/introduction/'
            URL_PATH=$(echo "$FIRST_FILE" | sed 's|^en/docs/||' | sed 's|\.md$|/|' | sed 's|index/|/|')
            echo "url_path=$URL_PATH" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Screenshot will be taken for: $URL_PATH"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No markdown files changed"
          fi

      - name: Build documentation
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          cd en
          mkdocs build --site-dir ../site

      - name: Setup Node.js for screenshot
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Serve documentation and take screenshot
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          cd site
          
          # Start a simple HTTP server in background
          python -m http.server 8000 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 5
          
          # Take screenshot using Playwright
          cat > take_screenshot.js << 'EOF'
          const { chromium } = require('playwright');
          
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            
            // Set viewport size
            await page.setViewportSize({ width: 1200, height: 800 });
            
            const url = process.argv[2] || 'http://localhost:8000';
            console.log(`Taking screenshot of: ${url}`);
            
            try {
              await page.goto(url, { waitUntil: 'networkidle' });
              
              // Wait for content to load
              await page.waitForTimeout(2000);
              
              // Take screenshot of the main content area
              const content = await page.$('.md-content') || await page.$('main') || await page.$('body');
              if (content) {
                await content.screenshot({ path: 'doc-preview.png' });
              } else {
                await page.screenshot({ path: 'doc-preview.png', fullPage: true });
              }
              
              console.log('Screenshot saved as doc-preview.png');
            } catch (error) {
              console.error('Error taking screenshot:', error);
              // Take a basic screenshot as fallback
              await page.screenshot({ path: 'doc-preview.png' });
            }
            
            await browser.close();
          })();
          EOF
          
          # Execute screenshot script
          URL_PATH="${{ steps.changed-files.outputs.url_path }}"
          FULL_URL="http://localhost:8000/${URL_PATH}"
          node take_screenshot.js "$FULL_URL"
          
          # Kill the server
          kill $SERVER_PID
          
          # Move screenshot to workspace root
          mv doc-preview.png ../doc-preview.png

      - name: Upload screenshot artifact
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doc-preview-screenshot
          path: doc-preview.png
          retention-days: 7

      - name: Comment PR with screenshot
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the screenshot file
            const screenshotPath = 'doc-preview.png';
            
            if (fs.existsSync(screenshotPath)) {
              // Convert image to base64
              const imageBuffer = fs.readFileSync(screenshotPath);
              const base64Image = imageBuffer.toString('base64');
              
              // Get PR number
              const prNumber = context.payload.pull_request.number;
              
              // Check if there's already a preview comment
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });
              
              const existingComment = comments.data.find(comment => 
                comment.body.includes('📋 Documentation Preview') && 
                comment.user.login === 'github-actions[bot]'
              );
              
              const urlPath = '${{ steps.changed-files.outputs.url_path }}';
              const commentBody = `## 📋 Documentation Preview
              
              A documentation preview has been generated for the changes in this PR.
              
              **Changed Page**: \`${urlPath}\`
              
              ### Preview Screenshot:
              
              ![Documentation Preview](data:image/png;base64,${base64Image})
              
              ---
              
              💡 **Note**: This preview shows how the documentation will look after your changes are merged.
              
              <details>
              <summary>🔧 Technical Details</summary>
              
              - **Build Status**: ✅ Success
              - **MkDocs Version**: Built with the latest configuration
              - **Timestamp**: ${new Date().toISOString()}
              
              </details>`;
              
              if (existingComment) {
                // Update existing comment
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: commentBody
                });
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody
                });
              }
            } else {
              console.log('Screenshot file not found');
            }

      - name: Comment on build failure
        if: failure() && steps.changed-files.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            
            const commentBody = `## ❌ Documentation Build Failed
            
            The documentation build failed for this PR. Please check the following:
            
            - Verify that all markdown files have valid syntax
            - Check that any new images or assets are properly referenced
            - Ensure mkdocs.yml configuration is valid
            
            **Build logs**: Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed error information.
            
            ---
            
            🔧 Once you fix the issues, the preview will be automatically regenerated.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.changed-files.outputs.has_changes }}" == "true" ]; then
            echo "✅ Documentation preview workflow completed"
            echo "📁 Changed files processed"
            echo "📸 Screenshot generated and posted to PR"
          else
            echo "ℹ️  No documentation changes detected in this PR"
          fi
